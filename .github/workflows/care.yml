name: care

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  schedule:
    - cron: "0 */6 * * *"      # time passes even when nobody visits
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pet
  cancel-in-progress: false

jobs:
  care:
    # Ignore the pet's own replies, or it would talk to itself forever.
    if: github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Live a little
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTOR: ${{ github.event.comment.user.login || github.event.issue.user.login }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 creature.py

      - name: Answer in the thread
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment ${{ github.event.issue.number }} --body-file reply.txt

      - name: Save what happened
        run: |
          git config user.name "readme-pet"
          git config user.email "actions@github.com"
          git add state.json README.md
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "said something"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 3
          done
